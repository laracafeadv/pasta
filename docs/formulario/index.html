<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Formulário · Lara Café Advocacia</title>
<style>
:root{--bg:#edeae2;--card:#fffefb;--fg:#2b211d;--mut:#756a63;--pri:#3c2923;--acc:#8a6b45;--bd:#ddd6c9;--err:#b3261e;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#17110e;--card:#241a16;--fg:#efe9df;--mut:#b3a79c;--pri:#e8dcc8;--acc:#c9a46c;--bd:#3d302a;--err:#ff8a80;--ok:#7bd49c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#3c2923;color:#efe3cf;padding:18px 16px;text-align:center;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
header b{display:block;font:400 22px Georgia,serif;letter-spacing:.12em}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
h1{font:400 28px/1.2 Georgia,serif;margin:0 0 6px;color:var(--pri)}h2{font:400 20px Georgia,serif;margin:0 0 14px;color:var(--pri)}
.mut{color:var(--mut);font-size:14px}.q{display:grid;gap:6px;margin-top:18px}.q>label,.q>.rot{font-weight:600;font-size:15px}.q small{color:var(--mut)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:inherit;font:inherit}
textarea{min-height:100px;resize:vertical}.op{display:flex;gap:10px;align-items:center;padding:4px 0}.op input{width:18px;height:18px;accent-color:var(--acc)}
.end{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.end>*{min-width:0}.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
canvas{width:100%;height:160px;border:1px dashed var(--bd);border-radius:12px;background:#fff;touch-action:none}
button{font:inherit;cursor:pointer}.btn{background:var(--pri);color:var(--bg);border:0;border-radius:999px;padding:13px 28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;padding:0;font-size:13px}
.err{color:var(--err);font-size:14px;margin-top:6px}.erro-campo input,.erro-campo select,.erro-campo textarea{border-color:var(--err)}
.center{text-align:center}.ok{color:var(--ok);font-size:44px;line-height:1}
@media(max-width:480px){.c2,.c3,.c4{grid-column:span 6}}
</style>
</head>
<body>
<header>Lara Café<b>Advocacia &amp; Consultoria</b></header>
<main id="raiz"><p class="mut center">Carregando…</p></main>
<script>
'use strict'
// Página pública do formulário. Sem login: o link individual (?t=código) é a credencial. Só fala com a API do próprio CRM (Supabase).
const API = 'https://cuaeuazmgwdhfozrqkin.supabase.co/functions/v1/crm-api/formulario'
const T = new URLSearchParams(location.search).get('t') || ''
const raiz = document.getElementById('raiz')
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v; else if (k === 'for') e.htmlFor = v; else if (k in e && !k.includes('-')) e[k] = v; else e.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e }
const msg = (titulo, texto) => raiz.replaceChildren(el('section', { class: 'card center' }, el('h1', { text: titulo }), texto ? el('p', { class: 'mut', text: texto }) : null))
const api = async (opts = {}, q = '') => { const r = await fetch(API + q, opts); let j = {}; try { j = await r.json() } catch (e) { /* sem corpo */ } return { ok: r.ok, status: r.status, j } }

let F = null; const V = {}; const erros = {}; let iniciou = false, enviando = false
const semAcento = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
const num = v => Number(String(v).trim().replace(/\./g, '').replace(',', '.'))
const vazio = v => v == null || v === '' || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.values(v).some(Boolean))
function regra(r, v) { const alvo = String(r.valor ?? ''); switch (r.operador) {
  case 'preenchida': return !vazio(v); case 'vazia': return vazio(v)
  case 'igual': { if (Array.isArray(v)) return v.includes(alvo); if (vazio(v)) return false; const t = String(v).trim(); if (/^-?[\d.,]+$/.test(t) && /^-?[\d.,]+$/.test(alvo.trim())) return num(t) === num(alvo); return semAcento(t) === semAcento(alvo.trim()) }
  case 'diferente': return !regra({ ...r, operador: 'igual' }, v)
  case 'contem': return Array.isArray(v) ? v.includes(alvo) : (!vazio(v) && semAcento(v).includes(semAcento(alvo)))
  case 'nao_contem': return !regra({ ...r, operador: 'contem' }, v)
  case 'maior': return !vazio(v) && num(v) > num(alvo); case 'menor': return !vazio(v) && num(v) < num(alvo); default: return true } }
const cond = (c, ef) => { if (!c || !c.regras || !c.regras.length) return true; const r = c.regras.map(x => regra(x, ef[String(x.pergunta_id)])); return c.juntar === 'ou' ? r.some(Boolean) : r.every(Boolean) }
function visiveis() { const ef = {}, secs = new Set(), ps = new Set(); F.secoes.forEach((s, i) => { const ok = cond(s.mostrar_se, ef); if (ok) secs.add(i); for (const p of s.itens) if (ok && cond(p.mostrar_se, ef)) { ps.add(String(p.pergunta_id)); ef[String(p.pergunta_id)] = V[p.pergunta_id] } }); return { secs, ps } }
const mascara = v => { const d = v.replace(/\D/g, '').slice(0, 14); return d.length <= 11 ? d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2') : d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2') }
const UFS = ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO']

function mudou(p, v, redesenhar) { V[p.pergunta_id] = vazio(v) ? null : v; delete erros[p.pergunta_id]; if (!iniciou) { iniciou = true; api({ method: 'POST', body: JSON.stringify({ t: T }) }, '?acao=iniciar').catch(() => {}) } if (redesenhar) desenhar() }
function campo(p) {
  const v = V[p.pergunta_id], id = 'q' + p.pergunta_id, txt = typeof v === 'string' ? v : ''
  const entrada = (type, extra = {}) => el('input', { type, id, value: txt, oninput: e => mudou(p, e.target.value, false), ...extra })
  switch (p.tipo) {
    case 'texto_longo': return el('textarea', { id, value: txt, oninput: e => mudou(p, e.target.value, false) })
    case 'numero': return entrada('number', { step: 'any', inputMode: 'decimal' })
    case 'data': return entrada('date'); case 'horario': return entrada('time'); case 'email': return entrada('email', { autocomplete: 'email' }); case 'telefone': return entrada('tel', { autocomplete: 'tel' })
    case 'cpf_cnpj': return entrada('text', { inputMode: 'numeric', placeholder: '000.000.000-00', oninput: e => { e.target.value = mascara(e.target.value); mudou(p, e.target.value, false) } })
    case 'sim_nao': case 'selecao_unica': return el('div', {}, (p.tipo === 'sim_nao' ? ['Sim', 'Não'] : p.opcoes).map(o => el('label', { class: 'op' }, el('input', { type: 'radio', name: id, checked: v === o, onchange: () => mudou(p, o, true) }), o)))
    case 'lista_suspensa': return el('select', { id, onchange: e => mudou(p, e.target.value, true) }, el('option', { value: '', text: 'Escolha…' }), p.opcoes.map(o => el('option', { value: o, text: o, selected: v === o })))
    case 'selecao_multipla': { const l = Array.isArray(v) ? v : []; return el('div', {}, p.opcoes.map(o => el('label', { class: 'op' }, el('input', { type: 'checkbox', checked: l.includes(o), onchange: () => mudou(p, l.includes(o) ? l.filter(x => x !== o) : [...l, o], true) }), o))) }
    case 'endereco': { const o = v && typeof v === 'object' ? { ...v } : {}; const c = (k, rot, cls, extra = {}) => el('div', { class: cls }, el('input', { type: 'text', placeholder: rot, 'aria-label': rot, value: o[k] || '', ...extra, oninput: e => { if (k === 'cep') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8).replace(/^(\d{5})(\d)/, '$1-$2'); o[k] = e.target.value; mudou(p, { ...o }, false) } }))
      return el('div', { class: 'end' }, c('cep', 'CEP', 'c2', { inputMode: 'numeric' }), c('logradouro', 'Rua / avenida', 'c4'), c('numero', 'Número', 'c2'), c('complemento', 'Complemento', 'c4'), c('bairro', 'Bairro', 'c3'), c('cidade', 'Cidade', 'c2'), el('div', {}, el('select', { 'aria-label': 'UF', onchange: e => { o.uf = e.target.value; mudou(p, { ...o }, false) } }, el('option', { value: '', text: 'UF' }), UFS.map(u => el('option', { value: u, text: u, selected: o.uf === u })))))
    }
    case 'assinatura': { const cv = el('canvas', { width: 640, height: 160, 'aria-label': 'Área de assinatura' }); const g = cv.getContext('2d'); g.lineWidth = 2.5; g.lineCap = 'round'; g.strokeStyle = '#1b1b1b'
      if (typeof v === 'string' && v.startsWith('data:image/')) { const im = new Image(); im.onload = () => g.drawImage(im, 0, 0); im.src = v }
      let d = false; const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height] }
      cv.addEventListener('pointerdown', e => { d = true; try { cv.setPointerCapture(e.pointerId) } catch (x) { /* ok */ } const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); g.lineTo(x + .1, y + .1); g.stroke() })
      cv.addEventListener('pointermove', e => { if (!d) return; const [x, y] = pt(e); g.lineTo(x, y); g.stroke() })
      const fim = () => { if (!d) return; d = false; mudou(p, cv.toDataURL('image/png'), false) }; cv.addEventListener('pointerup', fim); cv.addEventListener('pointerleave', fim)
      return el('div', {}, cv, el('button', { type: 'button', class: 'lnk', text: 'Limpar assinatura', onclick: () => { g.clearRect(0, 0, cv.width, cv.height); mudou(p, null, false) } })) }
    default: return entrada('text')
  }
}
let consent = false, respondente = '', erroGeral = ''
function desenhar() {
  const y = scrollY; const vis = visiveis(); const info = F._info
  const secoes = F.secoes.map((s, i) => !vis.secs.has(i) ? null : el('section', { class: 'card' }, s.titulo ? el('h2', { text: s.titulo }) : null, s.descricao ? el('p', { class: 'mut', text: s.descricao }) : null,
    s.itens.filter(p => vis.ps.has(String(p.pergunta_id))).map(p => el('div', { class: 'q' + (erros[p.pergunta_id] ? ' erro-campo' : ''), 'data-pergunta': p.pergunta_id }, el('label', { for: 'q' + p.pergunta_id, class: 'rot' }, p.texto, p.obrigatoria ? el('b', { text: ' *', style: 'color:var(--err)' }) : null), p.ajuda ? el('small', { text: p.ajuda }) : null, campo(p), erros[p.pergunta_id] ? el('div', { class: 'err', text: erros[p.pergunta_id] }) : null))))
  raiz.replaceChildren(
    el('section', { class: 'card' }, el('h1', { 'data-testid': 'titulo', text: info.formulario.nome }), info.formulario.descricao ? el('p', { class: 'mut', text: info.formulario.descricao, style: 'white-space:pre-line' }) : null, el('p', { class: 'mut', text: `${info.primeiroNome ? 'Olá, ' + info.primeiroNome + '. ' : ''}Este formulário é de ${info.advogada}. * indica resposta obrigatória.${info.prazo_resposta ? ' Responda, se possível, até ' + info.prazo_resposta.split('-').reverse().join('/') + '.' : ''}` })),
    info.formulario.instrucoes ? el('section', { class: 'card' }, el('p', { text: info.formulario.instrucoes, style: 'white-space:pre-line;margin:0' })) : null,
    ...secoes,
    el('section', { class: 'card' }, el('div', { class: 'q', style: 'margin-top:0' }, el('label', { for: 'resp', class: 'rot', text: 'Quem está preenchendo? (opcional)' }), el('input', { type: 'text', id: 'resp', maxLength: 120, value: respondente, oninput: e => { respondente = e.target.value } })),
      el('label', { class: 'op', style: 'align-items:flex-start;margin-top:14px' }, el('input', { type: 'checkbox', id: 'aceite', checked: consent, onchange: e => { consent = e.target.checked } }), el('span', { class: 'mut', text: 'Li e concordo: as respostas serão usadas só para o meu atendimento jurídico, com sigilo profissional e conforme a LGPD.' + (info.formulario.finalidade ? ' Finalidade: ' + info.formulario.finalidade : '') })),
      erroGeral ? el('div', { class: 'err', id: 'erro-geral', text: erroGeral }) : null,
      el('p', {}, el('button', { type: 'button', class: 'btn', id: 'enviar', disabled: enviando, text: enviando ? 'Enviando…' : 'Enviar formulário', onclick: enviar })),
    ))
  scrollTo(0, y)
}
function validarLocal() { const vis = visiveis(); let primeiro = null; for (const k of Object.keys(erros)) delete erros[k]
  F.secoes.forEach((s, i) => { if (!vis.secs.has(i)) return; for (const p of s.itens) { if (!vis.ps.has(String(p.pergunta_id))) continue; if (p.obrigatoria && vazio(V[p.pergunta_id])) { erros[p.pergunta_id] = 'Resposta obrigatória.'; primeiro = primeiro ?? p.pergunta_id } } }); return primeiro }
async function enviar() {
  erroGeral = ''; const primeiro = validarLocal(); if (primeiro != null) { desenhar(); document.querySelector(`[data-pergunta="${primeiro}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return }
  if (!consent) { erroGeral = 'Para enviar, confirme que leu o aviso de privacidade.'; desenhar(); return }
  enviando = true; desenhar()
  const r = await api({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: T, respostas: V, consentimento: true, respondente }) }).catch(() => ({ ok: false, j: { erro: 'Sem conexão. Tente de novo.' } }))
  enviando = false
  if (r.ok) { raiz.replaceChildren(el('section', { class: 'card center', 'data-testid': 'enviado' }, el('div', { class: 'ok', text: '✓' }), el('h1', { text: 'Formulário enviado com sucesso.' }), el('p', { class: 'mut', text: F._info.formulario.mensagem_final || 'Obrigada! Recebemos as suas respostas.' }))); scrollTo(0, 0); return }
  erroGeral = r.j.erro || 'Não foi possível enviar agora. Tente de novo em instantes.'; desenhar()
}
(async () => {
  if (!/^[A-Za-z0-9_-]{32,64}$/.test(T)) return msg('Link inválido', 'Peça um novo link ao escritório.')
  const r = await api({}, '?t=' + encodeURIComponent(T)).catch(() => null)
  if (!r) return msg('Sem conexão', 'Tente de novo em instantes.')
  if (!r.ok) return msg('Link indisponível', r.j.erro || 'Este link não é mais válido. Peça um novo ao escritório.')
  if (r.j.respondido) return msg('Formulário já respondido', 'Obrigada! Recebemos as suas respostas.')
  F = { secoes: r.j.secoes || [], _info: r.j }; document.title = r.j.formulario.nome + ' · Lara Café Advocacia'; desenhar()
})()
</script>
</body>
</html>
